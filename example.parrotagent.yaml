# ParrotAgent 配置示例。
# 复制为 .parrotagent.yaml 后按需修改。
# .parrotagent.yaml 已被 .gitignore 忽略，不会被提交。
#
# DeepSeek 为主测试目标（OpenAI 兼容协议）；
# OpenAI / Anthropic 保留兼容，需各自 key。

# 当前激活的 provider 名称（对应下方 providers 中某项的 name）。
# 省略时回退到 providers[0]。
active_provider: deepseek

providers:
  - name: deepseek
    protocol: openai
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}

  - name: mock
    protocol: mock
    model: mock-1

  - name: openai
    protocol: openai
    model: gpt-4o-mini
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  - name: claude
    protocol: anthropic
    model: claude-3-5-sonnet-20241022
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}

# 上下文管理配置（全部可选，省略时用默认值）
context:
  context_window_tokens: 64000    # 上下文窗口大小
  warning_fraction: 0.7           # token 占比超过此值发警告
  trigger_fraction: 0.9           # token 占比超过此值触发摘要
  per_result_threshold: 50000     # 单条工具结果截断阈值（字符数）
  round_total_threshold: 200000   # 一轮内工具结果合计截断阈值（字符数）
  preview_length: 2000            # 截断后保留预览长度（字符数）
  keep_recent_messages: 4         # 摘要时保留的最近消息数
  max_circuit_failures: 2         # 熔断器最大连续失败次数
  enable_auto_compress: true      # 是否启用自动压缩（false 时仅截断不摘要）

# MCP 客户端配置
mcp:
  enable: true
  servers:
    # Stdio MCP server 示例：filesystem 服务器
    - name: filesystem
      transport: stdio
      command: npx
      args: "-y @modelcontextprotocol/server-filesystem /tmp"
      # working_dir: /optional/working/directory
      # env:
      #   NODE_OPTIONS: "--max-old-space-size=4096"

    # HTTP MCP server 示例
